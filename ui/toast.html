<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RecompLauncher achievements</title>
<link rel="stylesheet" href="toast.css">
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="star" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="64" height="64"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#34f2e8"/><stop offset="1" stop-color="#377bb6"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d9962b"/></linearGradient><linearGradient id="silver" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#8d99aa"/></linearGradient></defs><path d="M32 5.5l7.9 16.1 17.7 2.6-12.8 12.5 3 17.6L32 46l-15.8 8.3 3-17.6L6.4 24.2l17.7-2.6z" fill="url(#sg)" stroke="#e9fffd" stroke-width="2" stroke-linejoin="round"/></svg>
  </div>
  <div class="text">
    <span class="kicker" id="kicker">Achievement Unlocked</span>
    <b class="title" id="title"></b>
    <span class="sub" id="sub"></span>
  </div>
  <span class="badge" id="badge">Mastered</span>
</div>
<div class="trk" id="trk" aria-live="polite">
  <svg class="trk-ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
  <span class="trk-text"><b id="trk-t"></b><span id="trk-n"></span></span>
  <span class="trk-v" id="trk-v"></span>
</div>
<script src="i18n.js"></script>
<script src="toast.js"></script>
</body>
</html>
