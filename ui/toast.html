<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RecompLauncher achievements</title>
<link rel="stylesheet" href="toast.css">
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="star" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="64" height="64"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#34f2e8"/><stop offset="1" stop-color="#377bb6"/></linearGradient></defs><path d="M32 5.5l7.9 16.1 17.7 2.6-12.8 12.5 3 17.6L32 46l-15.8 8.3 3-17.6L6.4 24.2l17.7-2.6z" fill="url(#sg)" stroke="#e9fffd" stroke-width="2" stroke-linejoin="round"/></svg>
  </div>
  <div class="text">
    <span class="kicker" id="kicker">Achievement Unlocked</span>
    <b class="title" id="title"></b>
    <span class="sub" id="sub"></span>
  </div>
  <span class="badge" id="badge">Mastered</span>
</div>
<script src="i18n.js"></script>
<script src="toast.js"></script>
</body>
</html>
