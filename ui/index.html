<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RecompLauncher</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="tv.css">
</head>
<body>
<div id="app">
  <aside data-t class="side" id="side" aria-label="RecompLauncher">
    <div class="brand" data-tauri-drag-region>
      <button data-t type="button" id="brand" aria-label="About RecompLauncher"><img class="mk" src="img/mark.svg" alt="" width="30" height="30"><img class="wm lbl" src="img/wordmark.svg" alt="RecompLauncher" height="15"></button>
    </div>
    <nav data-t class="navs" aria-label="Sections">
      <button data-t type="button" class="nav" data-go="home" title="Home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg><span class="lbl" data-t>Home</span></button>
      <button data-t type="button" class="nav" data-go="library" title="Library"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg><span class="lbl" data-t>Library</span></button>
      <button data-t type="button" class="nav" data-go="discover" title="Discover"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span class="lbl" data-t>Discover</span></button>
      <button data-t type="button" class="nav" data-go="downloads" title="Downloads"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg><span class="lbl" data-t>Downloads</span><b class="n" id="n-dl"></b></button>
      <button data-t type="button" class="nav" data-go="shots" title="Screenshots"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="lbl" data-t>Screenshots</span></button>
      <button data-t type="button" class="nav" data-go="saves" title="Saves"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 3v3.5M12 3v3.5M15 3v3.5M8.5 12h7v5h-7z"/></svg><span class="lbl" data-t>Saves</span></button>
    </nav>
    <div class="pins-h lbl" id="pins-h" data-t hidden>Pinned</div>
    <div class="pins" id="pins"></div>
    <div class="side-foot">
      <button type="button" class="nav acc-btn" id="acc-btn" data-act="acc-btn" title="Sign in"></button>
      <button data-t type="button" class="nav" data-act="tv" title="Big Picture mode"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="13" rx="2.5"/><path d="M8 21h8"/><path d="m10.5 8.5 4 2.5-4 2.5z" fill="currentColor"/></svg><span class="lbl" data-t>Big Picture mode</span></button>
      <button data-t type="button" class="nav" data-go="settings" title="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg><span class="lbl" data-t>Settings</span></button>
      <button data-t type="button" class="nav" id="collapse" title="Collapse" aria-label="Collapse the sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path class="arr" d="m16 9-3 3 3 3"/></svg><span class="lbl" data-t>Collapse</span></button>
    </div>
  </aside>
  <div class="mainwrap">
    <div class="topbar" data-tauri-drag-region>
      <span class="offline-pill" id="offline" data-t hidden>Offline</span>
      <div class="win">
        <button data-t type="button" id="w-min" aria-label="Minimize"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button data-t type="button" id="w-max" aria-label="Maximize"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
        <button data-t type="button" id="w-close" class="close" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="m2 2 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <main id="main" tabindex="-1"><div class="loading" data-t>Loading…</div></main>
  </div>
</div>
<div id="tv" hidden></div>
<div class="island" id="island" aria-live="polite">
  <div class="toasts" id="toasts"></div>
  <button type="button" class="isl" id="isl" hidden></button>
</div>
<script src="i18n.js"></script>
<script src="titlecase.js"></script>
<script src="looks.js"></script>
<script src="app.js"></script>
<script src="drops.js"></script>
<script src="scrollbar.js"></script>
<script src="account.js"></script>
<script src="more.js"></script>
<script src="beta.js"></script>
<script src="adopt.js"></script>
<script src="tv.js"></script>
<script src="firstrun.js"></script>
</body>
</html>
