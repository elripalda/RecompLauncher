name: Release builds

# Pushing a version tag (v0.90.0-beta.25) builds Windows, Linux and Mac together and puts every
# file in a draft release for that tag. Nothing is public until the draft is published.
# A version bump on main (src-tauri/tauri.conf.json) does the same by itself: the tag is made from
# the new version, so a release never has to be put together by hand.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['src-tauri/tauri.conf.json']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build (made from this branch's latest commit if it doesn't exist yet)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Run from the Actions page with a tag that isn't there yet: the tag is made here, on the commit
  # it was run on. (A tag pushed with this token doesn't start another run.)
  tag:
    name: Tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      go: ${{ steps.which.outputs.go }}
    steps:
      - uses: actions/checkout@v6
        if: github.ref_type != 'tag'
        with:
          fetch-depth: 0
      # A run from the Actions page names its tag; a pushed tag is its own; a push to main is the
      # version in tauri.conf.json, built only when that version has no tag yet.
      - name: Which tag
        id: which
        env:
          INPUT: ${{ github.event.inputs.tag }}
        run: |
          go=true
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then tag="$INPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          else
            tag="v$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already has a tag; nothing to build."; go=false
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - name: Make the tag, or move it to this commit while nothing is published
        if: github.ref_type != 'tag' && steps.which.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Not a version tag: $TAG" >&2; exit 1;; esac
          at=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$at" ] || at=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$at" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "Made $TAG on $GITHUB_SHA."
          elif [ "$at" = "$GITHUB_SHA" ]; then
            echo "$TAG is already on $GITHUB_SHA."
          elif gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "$TAG is published on $at; it isn't moved." >&2
            exit 1
          else
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            echo "Moved $TAG from $at to $GITHUB_SHA (nothing was published for it)."
          fi

  build:
    needs: tag
    if: needs.tag.outputs.go == 'true'
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,appimage
          - name: Mac
            os: macos-15
            bundles: app,dmg

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libudev-dev libssl-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --locked

      - name: Build
        shell: bash
        # Packaging downloads Tauri's tools from GitHub, which sometimes answers 504: tried again
        # (the compiled launcher is kept, so only the packaging runs again).
        run: |
          for i in 1 2 3 4; do
            npm run build -- --bundles ${{ matrix.bundles }} -- --locked 2>&1 | tee build.log && exit 0
            grep -q "http status: 50" build.log || exit 1
            echo "GitHub download failed, trying again in $((i * 30))s"
            sleep $((i * 30))
          done
          exit 1
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # The launcher must start on a PC without the Visual C++ runtime.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}

      - name: Brand the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Tauri keeps its own NSIS; the branding script finds it and rebuilds the installer with it.
          python tools/brand-installer.py src-tauri/target/release

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          b=src-tauri/target/release/bundle
          case "${{ runner.os }}" in
            Windows) cp "$b"/nsis/*-setup.exe out/ ;;
            Linux) cp "$b"/deb/*.deb "$b"/appimage/*.AppImage out/ ;;
            macOS)
              codesign --verify --deep --strict "$b/macos/RecompLauncher.app"
              cp "$b"/dmg/*.dmg out/ ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

  draft:
    name: Put the files in a draft
    needs: [tag, build]
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true

      - name: Source zip
        run: |
          v="${TAG#v}"
          git archive --format=zip --prefix="RecompLauncher-$v/" HEAD -o "out/RecompLauncher-$v-source.zip"
          ls -l out

      # Nothing is uploaded unless every built file is this tag's version and the app itself says so.
      - name: Check the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          for f in package.json src-tauri/tauri.conf.json; do
            have=$(jq -r .version "$f")
            [ "$have" = "$v" ] || { echo "::error::$f says $have, but the tag is $TAG."; exit 1; }
          done
          for f in out/*; do echo "$(basename "$f") sha256:$(sha256sum "$f" | cut -d' ' -f1)"; done \
            | bash tools/check-release-files.sh "$TAG"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          # v0.90.0-beta.25 -> "RecompLauncher 0.90 Beta 25", notes from docs/PATCH-NOTES-0.90-beta-25.md
          major_minor=$(echo "$v" | cut -d. -f1-2)
          beta=$(echo "$v" | sed -n 's/.*-beta\.\([0-9]*\).*/\1/p')
          title="RecompLauncher $major_minor${beta:+ Beta $beta}"
          notes="docs/PATCH-NOTES-$major_minor${beta:+-beta-$beta}.md"
          # The notes file's own heading isn't repeated in the release.
          if [ -f "$notes" ]; then sed '1{/^# /d}' "$notes" | sed '/./,$!d' > body.md; else : > body.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Only ever a draft: a published release is never changed from here.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "$TAG is already published; nothing was changed." >&2
              exit 1
            fi
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --draft --prerelease --title "$title" --notes-file body.md --verify-tag
          fi

      # A file added to the draft by hand (the draft is kept between runs) is checked too, so a wrong
      # one fails this run, which has to be green before the draft is published.
      - name: Check the draft's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | \"\(.name) \(.digest // \"\")\"" \
            | bash tools/check-release-files.sh "$TAG"
