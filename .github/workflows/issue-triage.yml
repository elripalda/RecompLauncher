name: Issue triage

# Game crashes and game problems belong on the game's own page, not here. This sends them there with a
# link that opens a ready-made report for the game's developer, and closes them. Plain rules, no AI:
# see .github/scripts/triage-issues.js. Run it by hand to go through the open ones.
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number || 'sweep' }}

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const triage = require('./.github/scripts/triage-issues.js');
            await triage({ github, context, core });
