name: Android

# Builds the Android test app (an APK for arm64 phones, handhelds and TVs). It runs when the
# Android parts change, or by hand. The APK is kept for a week (time to put it on a phone): it's a test build.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android.yml
      - src-tauri/gen/android/**
      - src-tauri/src/mobile.rs
      - src-tauri/src/android.rs
      - ui/phone.*
      - ui/droid.js
      - src-tauri/src/*_mobile.rs
      - .github/scripts/android-smoke.sh
      - .github/scripts/maven-mirror.gradle

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Gradle's downloads are kept between runs.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/**/*.gradle.kts
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
          save-if: false

      - name: Install
        run: npm ci

      # The runner has the Android SDK and NDK already (ANDROID_HOME, ANDROID_NDK_LATEST_HOME).
      # Maven Central turns shared CI machines away when they ask too often (429 Too Many
      # Requests): Gradle gets its files from Google's copy of Maven Central instead.
      - name: Use Google's copy of Maven Central
        run: install -D .github/scripts/maven-mirror.gradle ~/.gradle/init.d/maven-mirror.gradle

      # The same debug key every run (it's only for test builds), so a new APK installs over the
      # last one and keeps the player's games and settings.
      - name: Keep the test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-test-signing-key-v1

      # An optimized build, one APK per kind of chip: phones get the arm64 one (a debug build for
      # both kinds was about 100 MB); the x86_64 one is only for the emulator check below.
      - name: Build the APK
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK_HOME"
          npx tauri android build --apk --split-per-abi --target aarch64 --target x86_64
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec ls -l {} \;

      - uses: actions/upload-artifact@v5
        with:
          name: recomplauncher-android-test
          path: src-tauri/gen/android/app/build/outputs/apk/**/*arm64*.apk
          retention-days: 7
          if-no-files-found: error

      # Opens the APK on an Android emulator and prints two small screenshots and the app's log into
      # this job's log, so a build can be checked without a phone.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh
